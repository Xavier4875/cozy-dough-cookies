server {
    listen 80;

    # React Router's client-side routes (/menu, /sign-in, etc.) aren't real
    # files on disk — fall back to index.html so the SPA's own router
    # handles them, instead of nginx 404ing on a direct load or refresh.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Mirrors vite.config.js's dev-server proxy (`'/api': 'http://localhost:4000'`)
    # — same relative-path calls from the frontend code work unchanged here.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

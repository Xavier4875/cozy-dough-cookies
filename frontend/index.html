<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cozy Dough Cookies</title>

    <!-- What search results and shared links (Facebook, text messages, etc.) show for the site.
         There is deliberately no og:url or canonical link: this one page serves every route
         (/menu, /policy, ...), so a fixed address here would make every shared link point home.
         og-chip.jpg is a 1200x630 image of Mr. Chip with his hot chocolate on plain white (see
         frontend/public). It has its own file name so a link preview cached under an earlier
         image's address can't keep showing the old picture. -->
    <meta
      name="description"
      content="Homemade cookies from Cozy Dough Cookies, a family-owned home bakery in the Bellevue, Nebraska area. Order online for pickup or shipping."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cozy Dough Cookies" />
    <meta property="og:title" content="Cozy Dough Cookies – Homemade Cookies in Bellevue, Nebraska" />
    <meta
      property="og:description"
      content="A small, family-owned home bakery. Real butter, organic ingredients whenever possible, and every batch made with care. Order online for pickup or shipping."
    />
    <meta property="og:image" content="https://cozydoughcookies.com/og-chip.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Mr. Chip, the Cozy Dough Cookies cookie mascot, relaxing in a wooden chair with a mug of hot chocolate and marshmallows"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Tab and home-screen icons: Mr. Chip. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
